version: '3.8'

services:
  # ===================================================
  # 1. OpsGuard Real-Time Gateway & Mission Control
  # ===================================================
  opsguard-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsguard-control-plane
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEMO_MODE=true
      - SANDBOX_ISOLATION_MODE=DOCKER_CONTAINER_ISOLATED
      # Agent Router Configuration
      - AGENTROUTER_API_KEY=${AGENTROUTER_API_KEY:-sk-qqWLC6HGwqL8UW1GJOU1RawlG1DHr8cgr46a4F36NJ7JHvDz}
      - AGENTROUTER_BASE_URL=${AGENTROUTER_BASE_URL:-https://agentrouter.org/v1}
      - AGENTROUTER_MODEL=${AGENTROUTER_MODEL:-deepseek-v4-flash}
      # Optional external providers:
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - opsguard-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/system/status']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - opsguard-network

  # ===================================================
  # 2. OpsGuard Isolated Replay Lab Sandbox Worker
  # ===================================================
  opsguard-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsguard-replay-sandbox
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SANDBOX_RUNNER=true
      - ISOLATION_LEVEL=STRICT_READONLY_PROD
      - AGENTROUTER_API_KEY=${AGENTROUTER_API_KEY:-sk-9WIlHRrJAJSNXh3Lqb13aApU3XgVtl4sgiMAiNWDIpPoilGH}
      - AGENTROUTER_BASE_URL=${AGENTROUTER_BASE_URL:-https://agentrouter.org/v1}
      - AGENTROUTER_MODEL=${AGENTROUTER_MODEL:-deepseek-v4-flash}
    volumes:
      - opsguard-data:/app/data:ro # Read-only mount guarantees zero production DB mutation
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3001/api/system/status']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - opsguard-network
    depends_on:
      - opsguard-core

  # ===================================================
  # 3. OpsGuard Real-Time Live WhatsApp Discussion Streamer
  # ===================================================
  opsguard-whatsapp-stream:
    build:
      context: ./services/whatsapp-stream
      dockerfile: Dockerfile
    container_name: opsguard-whatsapp-stream
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=production
      - PORT=3002
      - OPSGUARD_CORE_URL=http://opsguard-core:3000
      - STREAM_INTERVAL_MS=4500
    networks:
      - opsguard-network
    depends_on:
      - opsguard-core

volumes:
  opsguard-data:
    driver: local

networks:
  opsguard-network:
    driver: bridge
